<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 民安 社区民生政策服务智能体</title>
<style>
/* 设计令牌与 index.html 保持一致，两个页面看起来才是同一个产品 */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --surface-2: #f9f9f7;
  --surface-3: #f3f3f0;
  --page: #f9f9f7;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --border: rgba(11, 11, 11, 0.10);
  --border-strong: rgba(11, 11, 11, 0.18);
  --critical: #d03b3b;
  --accent: #2a78d6;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.05);
  --sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-2: #131312;
    --surface-3: #242422;
    --page: #0d0d0d;
    --ink-1: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --accent: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.4);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  font-family: var(--sans);
  font-size: 14px; line-height: 1.65;
  color: var(--ink-1);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 100%; max-width: 380px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 32px 28px 24px;
}

.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .logo { font-size: 17px; font-weight: 650; letter-spacing: .5px; }
.brand .logo::before {
  content: ""; display: inline-block; width: 8px; height: 8px;
  border-radius: 2px; background: var(--accent); margin-right: 8px;
  vertical-align: 2px;
}
.brand .sub { font-size: 12px; color: var(--ink-3); }

h1 {
  margin: 20px 0 4px;
  font-size: 15px; font-weight: 600;
}
.hint { margin: 0 0 20px; font-size: 12.5px; color: var(--ink-3); }

label {
  display: block; margin-bottom: 6px;
  font-size: 12.5px; font-weight: 500; color: var(--ink-2);
}
.field { margin-bottom: 14px; }
input {
  width: 100%; padding: 9px 12px;
  font: inherit; font-size: 14px;
  color: var(--ink-1);
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  transition: border-color .12s, box-shadow .12s;
}
input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}

button {
  width: 100%; margin-top: 6px; padding: 10px;
  font: inherit; font-size: 14px; font-weight: 600;
  color: #fff; background: var(--accent);
  border: 0; border-radius: var(--radius-sm);
  cursor: pointer;
}
button:hover { filter: brightness(1.06); }
button:active { filter: brightness(.94); }

.err {
  display: none;
  margin-bottom: 16px; padding: 9px 12px;
  font-size: 13px; color: var(--critical);
  background: color-mix(in srgb, var(--critical) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--critical) 28%, transparent);
  border-radius: var(--radius-sm);
}
.err.show { display: block; }

footer {
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--ink-3); text-align: center;
}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="logo">民安</span>
      <span class="sub">社区民生政策服务智能体</span>
    </div>

    <h1>评审登录</h1>
    <p class="hint">请输入大赛组委会提供的评审账号。</p>

    <div class="err" id="err" role="alert">账号或密码不正确，请重新输入。</div>

    <form method="post" action="/login">
      <div class="field">
        <label for="user">账号</label>
        <input id="user" name="user" type="text" autocomplete="username"
               required autofocus autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="pass">密码</label>
        <input id="pass" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit">登 录</button>
    </form>

    <footer>本页面仅供大赛评审使用</footer>
  </main>

<script>
"use strict";
// 错误提示靠查询参数，登录本身不依赖 JS——JS 出错也照样进得去门
if (new URLSearchParams(location.search).has("e")) {
  document.getElementById("err").classList.add("show");
}
</script>
</body>
</html>
