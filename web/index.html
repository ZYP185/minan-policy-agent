<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>民安 · 社区民生政策服务智能体</title>
<style>
/* ── 设计令牌 ────────────────────────────────────────────────────────────
   颜色只承担一种语义：状态。政策类别等分类信息一律用中性色 + 文字，
   避免"颜色到底代表什么"的歧义。
   状态色固定取自校验过的状态板；浅色底上 warning/serious 对比度低于 3:1，
   因此状态永远以「图标 + 文字」成对出现，绝不靠颜色单独表意。            */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --surface-2: #f9f9f7;
  --surface-3: #f3f3f0;
  --page: #f9f9f7;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --rule: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --border-strong: rgba(11, 11, 11, 0.18);

  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --success-text: #006300;

  --accent: #2a78d6;
  --accent-soft: #cde2fb;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.05);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-2: #131312;
    --surface-3: #242422;
    --page: #0d0d0d;
    --ink-1: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --rule: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --success-text: #0ca30c;
    --accent: #3987e5;
    --accent-soft: #184f95;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.4);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink-1);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
}

/* ── 布局 ────────────────────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; }

header.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px; height: 56px; flex: 0 0 56px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .logo {
  font-size: 17px; font-weight: 650; letter-spacing: .5px;
}
.brand .logo::before {
  content: ""; display: inline-block; width: 8px; height: 8px;
  border-radius: 2px; background: var(--accent); margin-right: 8px;
  vertical-align: 2px;
}
.brand .sub { font-size: 12px; color: var(--ink-3); }

.modes { display: flex; gap: 2px; margin-left: auto; background: var(--surface-3);
  padding: 3px; border-radius: 8px; }
.mode-btn {
  border: 0; background: transparent; font: inherit; font-size: 13px;
  color: var(--ink-2); padding: 5px 14px; border-radius: 6px; cursor: pointer;
}
.mode-btn[aria-selected="true"] {
  background: var(--surface-1); color: var(--ink-1); font-weight: 600;
  box-shadow: 0 1px 2px rgba(11,11,11,.08);
}
.mode-btn:hover:not([aria-selected="true"]) { color: var(--ink-1); }

.main { display: grid; grid-template-columns: 268px minmax(0,1fr) 320px;
  flex: 1; min-height: 0; }

aside { background: var(--surface-1); overflow-y: auto; min-height: 0; }
aside.left { border-right: 1px solid var(--border); }
aside.right { border-left: 1px solid var(--border); }

.panel { padding: 16px; border-bottom: 1px solid var(--border); }
.panel:last-child { border-bottom: 0; }
.panel-title {
  font-size: 11px; font-weight: 600; letter-spacing: .9px;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 12px;
}

/* ── 对话区 ──────────────────────────────────────────────────────────── */
.chat { display: flex; flex-direction: column; min-height: 0; background: var(--page); }
.stream { flex: 1; overflow-y: auto; padding: 24px 28px 8px; min-height: 0; }
.stream-inner { max-width: 760px; margin: 0 auto; }

.msg { margin-bottom: 22px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble {
  background: var(--accent); color: #fff; padding: 10px 15px;
  border-radius: 14px 14px 3px 14px; max-width: 78%; white-space: pre-wrap;
  word-break: break-word;
}
.msg.agent .bubble {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 3px 14px 14px 14px; padding: 14px 18px;
  box-shadow: var(--shadow); word-break: break-word;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .msg.user .bubble { color: #0d0d0d; }
}

/* Markdown */
.bubble h3 { font-size: 15px; margin: 18px 0 8px; font-weight: 650; }
.bubble h3:first-child { margin-top: 0; }
.bubble p { margin: 8px 0; }
.bubble ul, .bubble ol { margin: 8px 0; padding-left: 20px; }
.bubble li { margin: 3px 0; }
.bubble strong { font-weight: 650; }
.bubble code {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--surface-3); padding: 1px 5px; border-radius: 4px;
}
.bubble hr { border: 0; border-top: 1px solid var(--grid); margin: 14px 0; }
.cite {
  font-size: 12px; color: var(--ink-2); background: var(--surface-3);
  border-radius: 4px; padding: 1px 6px; margin-left: 2px; white-space: nowrap;
  border-left: 2px solid var(--accent); cursor: pointer;
}
.cite:hover { color: var(--ink-1); }

/* ── 工具调用轨迹（证明这是 Agent 而非问答机器人）───────────────────── */
.trace { margin: 0 0 12px; display: flex; flex-direction: column; gap: 5px; }
.step {
  display: flex; align-items: center; gap: 9px;
  font-size: 12.5px; color: var(--ink-2);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 12px 4px 9px;
  width: fit-content; max-width: 100%;
}
.step .glyph {
  width: 14px; height: 14px; flex: 0 0 14px; border-radius: 50%;
  display: grid; place-items: center; font-size: 9px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent); line-height: 1;
}
.step.run .glyph { animation: pulse 1.1s ease-in-out infinite; }
.step.done .glyph { background: var(--good); color: #fff; }
.step.fail .glyph { background: var(--critical); color: #fff; }
.step .detail { color: var(--ink-3); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
@media (prefers-reduced-motion: reduce) { .step.run .glyph { animation: none } }

/* ── 卡片 ────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); margin: 0 0 12px; overflow: hidden;
  box-shadow: var(--shadow);
}
.card-head {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 16px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 650;
}
.card-head .kind {
  font-size: 10.5px; font-weight: 600; letter-spacing: .5px;
  color: var(--ink-3); text-transform: uppercase;
}
.card-body { padding: 14px 16px; }

/* KPI 行 */
.kpis { display: flex; gap: 10px; flex-wrap: wrap; }
.kpi {
  flex: 1 1 96px; padding: 11px 13px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.kpi .k-label {
  font-size: 11.5px; color: var(--ink-2); display: flex;
  align-items: center; gap: 5px; margin-bottom: 3px;
}
.kpi .k-value { font-size: 24px; font-weight: 650; line-height: 1.15; }

/* 状态标记：图标 + 文字成对，颜色只是第三重线索 */
.verdict {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.verdict svg { width: 13px; height: 13px; flex: 0 0 13px; }
.verdict.good     { color: var(--success-text); }
.verdict.warning  { color: var(--ink-1); }
.verdict.serious  { color: var(--ink-1); }
.verdict.critical { color: var(--critical); }
.verdict .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.verdict.good .dot     { background: var(--good); }
.verdict.warning .dot  { background: var(--warning); }
.verdict.serious .dot  { background: var(--serious); }
.verdict.critical .dot { background: var(--critical); }

/* 政策匹配条目 */
.match {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 13px; margin-bottom: 9px; background: var(--surface-2);
}
.match:last-child { margin-bottom: 0; }
.match-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.match-name { font-weight: 600; font-size: 13.5px; flex: 1; line-height: 1.45; }
.match-reason { font-size: 12.5px; color: var(--ink-2); margin: 4px 0 0; }
.match-benefit {
  font-size: 12.5px; margin-top: 7px; padding: 7px 10px;
  background: var(--surface-1); border-radius: 5px; border: 1px solid var(--border);
}
.tag {
  display: inline-block; font-size: 11px; color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 6px; margin-right: 5px; background: var(--surface-1);
}
.rules { margin: 7px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
.rules li { display: flex; gap: 7px; align-items: flex-start; margin: 3px 0; }
.rules li .mark { flex: 0 0 12px; font-weight: 700; line-height: 1.5; }
.rules li.ok .mark { color: var(--success-text); }
.rules li.no .mark { color: var(--critical); }
.rules li.q  .mark { color: var(--ink-3); }

/* 材料清单 */
.mat { display: flex; flex-wrap: wrap; gap: 7px; }
.mat span {
  font-size: 12.5px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2);
  display: inline-flex; align-items: center; gap: 6px;
}
.mat span.have { border-color: var(--good); }
.mat span.miss { border-color: var(--critical); }
.mat span .mark { font-weight: 700; }
.mat span.have .mark { color: var(--success-text); }
.mat span.miss .mark { color: var(--critical); }

/* 流程步骤条 */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li {
  position: relative; padding: 0 0 14px 30px; font-size: 13px; counter-increment: s;
}
.steps li:last-child { padding-bottom: 0; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 1px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--surface-3); color: var(--ink-2);
  font-size: 11px; font-weight: 650; display: grid; place-items: center;
}
.steps li::after {
  content: ""; position: absolute; left: 9.5px; top: 23px; bottom: 2px;
  width: 1px; background: var(--grid);
}
.steps li:last-child::after { display: none; }

/* 表单草稿 */
.form-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 5px 0; border-bottom: 1px dashed var(--grid); font-size: 13px;
}
.form-row:last-child { border-bottom: 0; }
.form-row .k { color: var(--ink-2); flex: 0 0 108px; }
.form-row .v { flex: 1; text-align: right; }
.form-row .v.empty { color: var(--ink-3); font-style: italic; }

/* ── 侧栏组件 ────────────────────────────────────────────────────────── */
.stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.stat-row .k { color: var(--ink-2); }
.stat-row .v { font-weight: 600; }

.prof-row {
  display: flex; justify-content: space-between; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 12.5px;
}
.prof-row:last-child { border-bottom: 0; }
.prof-row .k { color: var(--ink-3); flex: 0 0 84px; }
.prof-row .v { text-align: right; font-weight: 550; }
.prof-row.empty .v { color: var(--ink-3); font-weight: 400; }

.policy-item {
  padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 7px; font-size: 12.5px; cursor: pointer; background: var(--surface-2);
  transition: border-color .12s;
}
.policy-item:hover { border-color: var(--border-strong); }
.policy-item .p-title { font-weight: 600; line-height: 1.45; margin-bottom: 3px; }
.policy-item .p-meta { color: var(--ink-3); font-size: 11.5px; }

.src {
  border-left: 2px solid var(--accent); padding: 7px 0 7px 10px;
  margin-bottom: 10px; font-size: 12px; cursor: pointer;
}
.src:last-child { margin-bottom: 0; }
.src .s-title { font-weight: 600; color: var(--ink-1); line-height: 1.45; }
.src .s-meta { color: var(--ink-3); margin-top: 2px; font-size: 11.5px; }
.src .s-text { color: var(--ink-2); margin-top: 5px; display: none; }
.src.open .s-text { display: block; }

.empty-hint { color: var(--ink-3); font-size: 12.5px; font-style: italic; }

/* 建议问题 */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 1px solid var(--border); background: var(--surface-1);
  color: var(--ink-2); font: inherit; font-size: 12.5px;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; text-align: left;
}
.chip:hover { border-color: var(--accent); color: var(--ink-1); }

/* ── 输入区 ──────────────────────────────────────────────────────────── */
.composer { flex: 0 0 auto; padding: 12px 28px 18px; background: var(--page); }
.composer-inner {
  max-width: 760px; margin: 0 auto; display: flex; gap: 9px; align-items: flex-end;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 9px 9px 9px 15px; box-shadow: var(--shadow);
}
.composer-inner:focus-within { border-color: var(--accent); }
textarea {
  flex: 1; border: 0; outline: 0; resize: none; font: inherit; color: var(--ink-1);
  background: transparent; max-height: 130px; line-height: 1.6; padding: 4px 0;
}
textarea::placeholder { color: var(--ink-3); }
.send {
  border: 0; border-radius: 7px; background: var(--accent); color: #fff;
  font: inherit; font-weight: 600; font-size: 13px; padding: 8px 17px; cursor: pointer;
  flex: 0 0 auto;
}
.send:disabled { opacity: .45; cursor: default; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .send { color: #0d0d0d; }
}

/* 欢迎屏 */
.welcome { text-align: center; padding: 40px 0 18px; }
.welcome h2 { font-size: 21px; margin: 0 0 9px; font-weight: 650; }
.welcome p { color: var(--ink-2); margin: 0 auto 22px; max-width: 460px; font-size: 13.5px; }
.welcome .chips { justify-content: center; }

.err {
  background: var(--surface-1); border: 1px solid var(--critical);
  border-left-width: 3px; border-radius: var(--radius-sm);
  padding: 11px 14px; font-size: 13px; color: var(--ink-1);
}
.err strong { color: var(--critical); }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 5px;
  border: 2px solid var(--surface-1); }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 1180px) {
  .main { grid-template-columns: 236px minmax(0,1fr); }
  aside.right { display: none; }
}
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0,1fr); }
  aside.left { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">民安</span>
      <span class="sub">社区民生政策服务智能体</span>
    </div>
    <div class="modes" role="tablist">
      <button class="mode-btn" role="tab" data-mode="resident" aria-selected="true">居民端</button>
      <button class="mode-btn" role="tab" data-mode="worker" aria-selected="false">社区工作端</button>
    </div>
  </header>

  <div class="main">
    <aside class="left">
      <div class="panel">
        <h3 class="panel-title">政策库</h3>
        <div id="stats"><span class="empty-hint">加载中…</span></div>
      </div>
      <div class="panel">
        <h3 class="panel-title">入库政策</h3>
        <div id="policy-list"><span class="empty-hint">加载中…</span></div>
      </div>
    </aside>

    <section class="chat">
      <div class="stream" id="stream">
        <div class="stream-inner">
          <div class="welcome" id="welcome">
            <h2>您好，我是民安</h2>
            <p>我可以帮您查政策、看条件、理材料、填表格。
               不用知道政策叫什么名字，说说您的情况就行。</p>
            <div class="chips" id="chips"></div>
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="说说您的情况，例如：我家老人 82 岁了，能领什么补贴？"></textarea>
          <button class="send" id="send">发送</button>
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="panel">
        <h3 class="panel-title">居民画像</h3>
        <div id="profile"><span class="empty-hint">对话中会自动积累</span></div>
      </div>
      <div class="panel">
        <h3 class="panel-title">引用来源</h3>
        <div id="sources"><span class="empty-hint">引用政策原文后显示</span></div>
      </div>
    </aside>
  </div>
</div>

<script>
"use strict";

// ── 状态 ──────────────────────────────────────────────────────────────
let MODE = "resident";
let BUSY = false;
let SID = "s-" + Math.random().toString(36).slice(2, 10);

const TOOL_LABEL = {
  update_profile: "记录居民信息",
  search_policy: "检索政策原文",
  read_clause: "调取条款原文",
  assess_eligibility: "政策资格体检",
  check_materials: "核对申请材料",
  generate_form: "生成申请表草稿",
  get_process: "梳理办理流程",
  scan_unapplied: "扫描辖区政策覆盖",
};

const VERDICT_LEVEL = {
  "符合": "good", "可能符合": "warning",
  "需补充信息": "serious", "需人工确认": "serious", "不符合": "critical",
};

const PROFILE_LABEL = {
  region: "所在区", hukou: "户籍", age: "年龄", employment: "就业状态",
  income: "家庭收入", family: "家庭情况", health: "健康状况",
  housing: "住房", insurance: "参保",
};

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ── 状态标记：图标 + 文字，颜色只作第三重线索 ────────────────────────
function verdictHTML(v) {
  const lvl = VERDICT_LEVEL[v] || "serious";
  const glyph = {
    good: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>',
    warning: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M8 5v4M8 11h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    serious: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M5.6 6.2c.5-.9 1.4-1.4 2.4-1.4 1.2 0 2.2.9 2.2 2 0 1.4-2.2 1.6-2.2 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M8 12h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    critical: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  }[lvl];
  return `<span class="verdict ${lvl}">${glyph}<span>${esc(v)}</span></span>`;
}

// ── Markdown 渲染（够用即可，不引第三方库）────────────────────────────
function md(src) {
  const blocks = String(src ?? "").split(/\n{2,}/);
  const out = [];
  for (let block of blocks) {
    block = block.trim();
    if (!block) continue;
    if (/^#{1,6}\s/.test(block)) {
      out.push(block.split("\n").map((ln) => {
        const m = ln.match(/^(#{1,6})\s+(.*)$/);
        return m ? `<h3>${inline(m[2])}</h3>` : `<p>${inline(ln)}</p>`;
      }).join(""));
      continue;
    }
    if (/^([-*+]|\d+\.)\s/.test(block)) {
      const items = block.split("\n").filter((l) => /^\s*([-*+]|\d+\.)\s/.test(l));
      const ordered = /^\s*\d+\./.test(items[0] || "");
      out.push(`<${ordered ? "ol" : "ul"}>` + items.map((l) =>
        `<li>${inline(l.replace(/^\s*([-*+]|\d+\.)\s+/, ""))}</li>`).join("") +
        `</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (/^(---|___|\*\*\*)$/.test(block)) { out.push("<hr>"); continue; }
    out.push(`<p>${inline(block.replace(/\n/g, "<br>"))}</p>`);
  }
  return out.join("");
}

function inline(t) {
  return esc(t)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/【依据：([^】]+)】/g,
      '<span class="cite" title="点击查看原文">【依据：$1】</span>');
}

// ── 卡片渲染 ──────────────────────────────────────────────────────────
const RENDER = {
  eligibility(a) {
    const p = a.payload || {};
    const order = ["符合", "可能符合", "需补充信息", "需人工确认", "不符合"];
    const counts = {};
    (p.results || []).forEach((r) => { counts[r.verdict] = (counts[r.verdict] || 0) + 1; });
    const kpis = order.filter((v) => counts[v]).map((v) =>
      `<div class="kpi"><div class="k-label">${verdictHTML(v)}</div>
       <div class="k-value">${counts[v]}</div></div>`).join("");

    const items = (p.results || []).filter((r) => r.verdict !== "不符合").map((r) => {
      const rules = []
        .concat((r.matched || []).map((t) => ["ok", "✓", t]))
        .concat((r.unknown || []).map((t) => ["q", "?", t]))
        .concat((r.unmatched || []).map((t) => ["no", "✕", t]));
      const benefit = (r.benefit || []).map((b) => {
        const std = b.standard || "";
        const cond = b.condition ? `（${b.condition}）` : "";
        return std ? `<div><strong>${esc(std)}</strong>${esc(cond)}</div>` : "";
      }).join("");
      return `<div class="match">
        <div class="match-top">
          <div class="match-name">${esc(r.title)}</div>
          ${verdictHTML(r.verdict)}
        </div>
        ${r.category ? `<span class="tag">${esc(r.category)}</span>` : ""}
        <div class="match-reason">${esc(r.reason)}</div>
        ${rules.length ? `<ul class="rules">${rules.map(([c, m, t]) =>
          `<li class="${c}"><span class="mark">${m}</span><span>${esc(t)}</span></li>`).join("")}</ul>` : ""}
        ${benefit ? `<div class="match-benefit">${benefit}</div>` : ""}
      </div>`;
    }).join("");

    const nope = (p.results || []).filter((r) => r.verdict === "不符合").length;
    return `<div class="card">
      <div class="card-head"><span class="kind">政策体检</span><span>${esc(a.title)}</span></div>
      <div class="card-body">
        <div class="kpis">${kpis}</div>
        ${items ? `<div style="margin-top:14px">${items}</div>` : ""}
        ${nope ? `<p class="empty-hint" style="margin:12px 0 0">另有 ${nope} 项经比对不符合条件，已略去。</p>` : ""}
      </div></div>`;
  },

  materials(a) {
    const p = a.payload || {};
    const chips = []
      .concat((p.already_have || []).map((m) => `<span class="have"><span class="mark">✓</span>${esc(m)}</span>`))
      .concat((p.missing || []).map((m) => `<span class="miss"><span class="mark">✕</span>${esc(m)}</span>`));
    const head = p.is_complete
      ? `<span class="verdict good">
           <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>
           <span>材料齐全</span></span>`
      : `<span class="verdict critical">
           <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
           <span>还缺 ${(p.missing || []).length} 项</span></span>`;
    return `<div class="card">
      <div class="card-head"><span class="kind">材料核对</span><span>${esc(a.title)}</span></div>
      <div class="card-body">
        <div style="margin-bottom:10px">${head}</div>
        <div class="mat">${chips.join("")}</div>
      </div></div>`;
  },

  process(a) {
    const p = a.payload || {};
    const steps = (p.process || []).map((s) => `<li>${esc(s)}</li>`).join("");
    const meta = [
      p.handler ? `<span class="tag">受理：${esc(p.handler)}</span>` : "",
      p.duration ? `<span class="tag">时限：${esc(p.duration)}</span>` : "",
      p.channel ? `<span class="tag">渠道：${esc(p.channel)}</span>` : "",
    ].join("");
    return `<div class="card">
      <div class="card-head"><span class="kind">办理指引</span><span>${esc(a.title)}</span></div>
      <div class="card-body">
        ${meta ? `<div style="margin-bottom:11px">${meta}</div>` : ""}
        ${steps ? `<ol class="steps">${steps}</ol>` : ""}
        ${p.note ? `<p class="empty-hint" style="margin:10px 0 0">${esc(p.note)}</p>` : ""}
      </div></div>`;
  },

  form(a) {
    const p = a.payload || {};
    const rows = (p.fields || []).map((f) => `<div class="form-row">
        <span class="k">${esc(f.name)}</span>
        <span class="v ${f.filled ? "" : "empty"}">${esc(f.value || "待填写")}</span>
      </div>`).join("");
    return `<div class="card">
      <div class="card-head"><span class="kind">申请表草稿</span><span>${esc(p.form_name || a.title)}</span></div>
      <div class="card-body">
        ${rows}
        <p class="empty-hint" style="margin:11px 0 0">
          已预填 ${p.filled_count}/${p.total_count} 项 · 核对后到官方渠道正式提交</p>
      </div></div>`;
  },

  scan(a) {
    const p = a.payload || {};
    const items = (p.items || []).map((it) => `<div class="match">
        <div class="match-top">
          <div class="match-name">${esc(it.title)}</div>
          ${it.category ? `<span class="tag">${esc(it.category)}</span>` : ""}
        </div>
        ${(it.target_group || []).length
          ? `<div class="match-reason">适用对象：${esc((it.target_group || []).join("；"))}</div>` : ""}
        ${(it.benefit || []).length
          ? `<div class="match-benefit">${(it.benefit || []).map((b) =>
              `<div><strong>${esc(b.standard || "")}</strong>${b.condition ? esc("（" + b.condition + "）") : ""}</div>`).join("")}</div>` : ""}
        ${it.handler ? `<div class="match-reason" style="margin-top:6px">受理单位：${esc(it.handler)}</div>` : ""}
      </div>`).join("");
    return `<div class="card">
      <div class="card-head"><span class="kind">辖区扫描</span><span>${esc(a.title)}${p.region ? " · " + esc(p.region) : ""}</span></div>
      <div class="card-body">${items || '<span class="empty-hint">无结果</span>'}</div>
    </div>`;
  },
};

function renderArtifact(a) {
  const fn = RENDER[a.kind];
  return fn ? fn(a) : "";
}

// ── 界面更新 ──────────────────────────────────────────────────────────
function addUser(text) {
  el("welcome")?.remove();
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  el("stream").querySelector(".stream-inner").appendChild(d);
  scrollDown();
}

function newAgentTurn() {
  const d = document.createElement("div");
  d.className = "msg agent";
  d.innerHTML = `<div class="trace"></div><div class="bubble" style="display:none"></div>`;
  el("stream").querySelector(".stream-inner").appendChild(d);
  scrollDown();
  return d;
}

function scrollDown() {
  const s = el("stream");
  s.scrollTop = s.scrollHeight;
}

function pushStep(turn, name, state, detail) {
  const trace = turn.querySelector(".trace");
  // 只在「最近一个、且仍在运行中」时复用节点，让 tool_call → tool_result
  // 能落到同一个芯片上；同一次回答里重复调用同一工具则各占一个芯片，
  // 这样能看出"它连读了两条原文"，而不是被覆盖成一条。
  const all = [...trace.querySelectorAll(".step")];
  const last = all[all.length - 1];
  let node = (last && last.dataset.tool === name && last.classList.contains("run")) ? last : null;
  if (!node) {
    node = document.createElement("div");
    node.className = "step";
    node.dataset.tool = name;
    node.innerHTML = `<span class="glyph"></span>
      <span>${esc(TOOL_LABEL[name] || name)}</span>
      <span class="detail"></span>`;
    trace.appendChild(node);
  }
  node.classList.remove("run", "done", "fail");
  node.classList.add(state);
  node.querySelector(".glyph").textContent = state === "done" ? "✓" : state === "fail" ? "!" : "";
  node.querySelector(".detail").textContent = detail || "";
  scrollDown();
}

function setProfile(profile) {
  const keys = Object.keys(PROFILE_LABEL);
  const rows = keys.map((k) => {
    const v = profile[k];
    return `<div class="prof-row ${v ? "" : "empty"}">
      <span class="k">${PROFILE_LABEL[k]}</span>
      <span class="v">${esc(v || "—")}</span></div>`;
  }).join("");
  el("profile").innerHTML = `<div style="margin:-6px 0">${rows}</div>`;
}

function addSources(items) {
  const box = el("sources");
  if (!items || !items.length) return;
  // 去重集合在循环内也要更新，否则同一批里的重复条目会漏网
  const seen = new Set([...box.querySelectorAll(".src")].map((n) => n.dataset.id));

  for (const s of items) {
    if (!s.clause_id || seen.has(s.clause_id)) continue;
    seen.add(s.clause_id);

    const d = document.createElement("div");
    d.className = "src";
    d.dataset.id = s.clause_id;
    d.innerHTML = `
      <div class="s-title">${esc(s.policy_title)}</div>
      <div class="s-meta">${esc(s.clause_no || "")} · ${esc(s.status || "")}${s.doc_number ? " · " + esc(s.doc_number) : ""}</div>
      <div class="s-text">${esc(s.text || "")}
        ${s.url ? `<div style="margin-top:7px"><a href="${esc(s.url)}" target="_blank" rel="noopener"
           style="color:var(--accent);font-size:11.5px">查看官方原文 ↗</a></div>` : ""}
      </div>`;
    d.onclick = (e) => {
      if (e.target.tagName === "A") return;   // 点链接直接跳转，不折叠
      d.classList.toggle("open");
    };
    box.appendChild(d);
  }
  const hint = box.querySelector(".empty-hint");
  if (hint) hint.remove();
}

function showError(turn, msg) {
  const b = turn.querySelector(".bubble");
  b.style.display = "";
  b.innerHTML = `<div class="err"><strong>出错了</strong><br>${esc(msg)}</div>`;
  scrollDown();
}

// ── SSE 发送 ──────────────────────────────────────────────────────────
async function send(text) {
  if (BUSY || !text.trim()) return;
  BUSY = true;
  el("send").disabled = true;
  el("welcome")?.remove();
  addUser(text);

  const turn = newAgentTurn();
  const bubble = turn.querySelector(".bubble");
  let acc = "";
  let pending = [];

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid: SID, mode: MODE, message: text }),
    });
    // 401 必须显式跳登录页：落到下面的通用分支的话，用户只会看到
    // 一句"服务返回 401"，完全不知道该怎么办。
    // 其余错误优先用服务端给的中文说明（比如 429 的"提问太快了"），
    // 比一个裸状态码有用得多。
    if (!resp.ok) {
      if (resp.status === 401) { location.replace("/login"); return; }
      let msg = `服务返回 ${resp.status}`;
      try {
        const j = await resp.json();
        if (j && j.error) msg = j.error;
      } catch (err) { /* 响应体不是 JSON，沿用默认文案 */ }
      throw new Error(msg);
    }
    if (!resp.body) throw new Error("服务未返回内容");

    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // SSE：按空行切事件
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const line = raw.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        handle(ev);
      }
    }
  } catch (e) {
    showError(turn, e.message || String(e));
  } finally {
    BUSY = false;
    el("send").disabled = false;
    el("input").focus();
    pending.forEach((a) => {
      const html = renderArtifact(a);
      if (html) turn.insertAdjacentHTML("beforebegin", html);
    });
    scrollDown();
  }

  function handle(ev) {
    switch (ev.type) {
      case "text":
        acc += ev.text;
        bubble.style.display = "";
        bubble.innerHTML = md(acc);
        scrollDown();
        break;
      case "tool_call":
        pushStep(turn, ev.name, "run", "");
        break;
      case "tool_result":
        pushStep(turn, ev.name, ev.ok ? "done" : "fail", ev.summary || "");
        break;
      case "artifact":
        pending.push(ev.artifact);
        break;
      case "profile":
        setProfile(ev.profile);
        break;
      case "citations":
        addSources(ev.citations || []);
        break;
      case "done":
        // 收尾：任何还挂在"运行中"的芯片都落定，避免动画一直转
        turn.querySelectorAll(".step.run").forEach((n) => {
          n.classList.replace("run", "done");
          n.querySelector(".glyph").textContent = "✓";
        });
        break;
      case "error":
        showError(turn, ev.message);
        break;
      default:
        break;
    }
  }
}

// ── 初始化 ────────────────────────────────────────────────────────────
async function loadMeta() {
  try {
    const r = await fetch("/api/meta");
    const m = await r.json();
    const s = m.stats || {};

    el("stats").innerHTML = `
      <div class="stat-row"><span class="k">政策文件</span><span class="v">${s["政策数"] ?? 0} 份</span></div>
      <div class="stat-row"><span class="k">政策条款</span><span class="v">${s["条款数"] ?? 0} 条</span></div>
      <div class="stat-row"><span class="k">覆盖地域</span><span class="v">${esc((s["地域"] || []).join("、") || "—")}</span></div>`;

    const plist = m.policies || [];
    el("policy-list").innerHTML = plist.length
      ? plist.map((p) => `<div class="policy-item" data-id="${esc(p.id)}">
          <div class="p-title">${esc(p.title)}</div>
          <div class="p-meta">${esc(p.category || "未分类")} · ${esc(p.status)}${p.structured ? " · 已结构化" : ""}</div>
        </div>`).join("")
      : '<span class="empty-hint">政策库为空</span>';

    el("policy-list").querySelectorAll(".policy-item").forEach((n) => {
      n.onclick = () => openPolicy(n.dataset.id);
    });

    setChips(m.suggestions || [], m.worker_suggestions || []);
  } catch (e) {
    el("stats").innerHTML = `<span class="empty-hint">加载失败：${esc(e.message)}</span>`;
  }
}

function setChips(resident, worker) {
  const list = MODE === "worker" ? worker : resident;
  el("chips").innerHTML = list.map((q) =>
    `<button class="chip">${esc(q)}</button>`).join("");
  el("chips").querySelectorAll(".chip").forEach((b) => {
    b.onclick = () => { el("input").value = b.textContent; send(b.textContent); el("input").value = ""; };
  });
}

let META_CACHE = null;
async function openPolicy(id) {
  try {
    const r = await fetch("/api/policy/" + encodeURIComponent(id));
    const p = await r.json();
    if (p.error) return;
    const w = window.open("", "_blank");
    if (!w) return;
    w.document.write(`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
      <title>${esc(p.title)}</title><style>
        body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
             max-width:760px;margin:44px auto;padding:0 24px;line-height:1.8;color:#0b0b0b;background:#fcfcfb}
        h1{font-size:20px;line-height:1.5;margin-bottom:8px}
        .meta{color:#52514e;font-size:13px;border-bottom:1px solid #e1e0d9;padding-bottom:14px;margin-bottom:20px}
        .clause{margin:0 0 14px} .no{font-weight:650;color:#0b0b0b}
        a{color:#2a78d6} .tag{display:inline-block;border:1px solid rgba(11,11,11,.1);
             border-radius:4px;padding:1px 7px;margin-right:6px;font-size:12px;color:#52514e}
      </style></head><body>
      <h1>${esc(p.title)}</h1>
      <div class="meta">
        <span class="tag">${esc(p.status)}</span>
        ${p.doc_number ? `<span class="tag">${esc(p.doc_number)}</span>` : ""}
        ${p.issuer ? `<span class="tag">${esc(p.issuer)}</span>` : ""}
        ${p.effective_date ? `<span class="tag">施行 ${esc(p.effective_date)}</span>` : ""}
        ${p.expiry_date ? `<span class="tag">有效期至 ${esc(p.expiry_date)}</span>` : ""}
        <br>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">查看官方原文 ↗</a>` : ""}
      </div>
      ${(p.clauses || []).map((c) => `<div class="clause"><span class="no">${esc(c.no)}</span> ${esc(c.text.replace(c.no, "").trim())}</div>`).join("")}
      </body></html>`);
    w.document.close();
  } catch (e) { /* 忽略 */ }
}

// ── 事件绑定 ──────────────────────────────────────────────────────────
document.querySelectorAll(".mode-btn").forEach((b) => {
  b.onclick = () => {
    if (BUSY) return;
    MODE = b.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach((x) =>
      x.setAttribute("aria-selected", String(x === b)));
    el("input").placeholder = MODE === "worker"
      ? "例如：扫描一下我辖区的政策覆盖情况"
      : "说说您的情况，例如：我家老人 82 岁了，能领什么补贴？";
    fetch("/api/reset", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid: SID, mode: MODE }),
    });
    el("stream").querySelector(".stream-inner").innerHTML = "";
    el("profile").innerHTML = '<span class="empty-hint">对话中会自动积累</span>';
    el("sources").innerHTML = '<span class="empty-hint">引用政策原文后显示</span>';
    fetch("/api/meta").then((r) => r.json()).then((m) =>
      setChips(m.suggestions || [], m.worker_suggestions || []));
    location.reload === null;
    resetWelcome();
  };
});

function resetWelcome() {
  const inner = el("stream").querySelector(".stream-inner");
  if (inner.querySelector(".welcome")) return;
  const d = document.createElement("div");
  d.className = "welcome";
  d.id = "welcome";
  d.innerHTML = `<h2>${MODE === "worker" ? "社区工作端" : "您好，我是民安"}</h2>
    <p>${MODE === "worker"
      ? "扫描辖区政策覆盖情况，找出应享未享的居民。"
      : "我可以帮您查政策、看条件、理材料、填表格。不用知道政策叫什么名字，说说您的情况就行。"}</p>
    <div class="chips" id="chips"></div>`;
  inner.appendChild(d);
  fetch("/api/meta").then((r) => r.json()).then((m) =>
    setChips(m.suggestions || [], m.worker_suggestions || []));
}

const input = el("input");
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 130) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const t = input.value;
    input.value = "";
    input.style.height = "auto";
    send(t);
  }
});
el("send").onclick = () => {
  const t = input.value;
  input.value = "";
  input.style.height = "auto";
  send(t);
};

loadMeta();
input.focus();
</script>
